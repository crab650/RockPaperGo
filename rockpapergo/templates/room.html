{% extends 'base.html' %}{% block title %}{{ t('room_title', code=room.code) }}{% endblock %}{% block content %}
<header><span id="round">{{ t('round', number=room.round_no) }}</span><span class="room-code">{{ t('room_number') }} <strong>{{ room.code }}</strong></span></header>
<div id="waiting" class="panel"><h1>{{ t('waiting') }}</h1><p>{{ t('share_link') }}</p><input id="invite" readonly value="{{ url_for('game.join', code=room.code, _external=True) }}"><button id="copy" type="button">{{ t('copy_invite') }}</button></div>
<div id="game" hidden><div class="score"><span id="name1"></span><b id="score1">0</b><i>：</i><b id="score2">0</b><span id="name2"></span><small>{{ t('draws') }} <span id="draws">0</span></small></div>
<h1 id="status">{{ t('choose_move') }}</h1><div class="moves"><button data-move="rock">✊<span>{{ t('rock') }}</span></button><button data-move="paper">✋<span>{{ t('paper') }}</span></button><button data-move="scissors">✌️<span>{{ t('scissors') }}</span></button></div>
<div id="reveal" class="reveal" hidden></div><button id="next" hidden>{{ t('next_round') }}</button></div>
<script>window.GAME={stateUrl:{{ url_for('game.state',code=room.code)|tojson }},moveUrl:{{ url_for('game.move',code=room.code)|tojson }},nextUrl:{{ url_for('game.next_round',code=room.code)|tojson }},csrf:{{ csrf_token()|tojson }},i18n:{{ {'rock':t('rock'),'paper':t('paper'),'scissors':t('scissors'),'round':t('round',number='{number}'),'chooseMove':t('choose_move'),'submitted':t('submitted'),'draw':t('draw_result'),'youWin':t('you_win'),'opponentWins':t('opponent_wins'),'connectionLost':t('connection_lost'),'copied':t('copied'),'played':t('played',name='{name}',move='{move}')}|tojson }}};</script>
<script src="{{ url_for('static', filename='game.js') }}"></script>{% endblock %}
